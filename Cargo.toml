[workspace]
resolver = "3"
members = [
    # platform-neutral
    "ext4-core/crates/ext4-core",
    "ext4-core/crates/ext4-tool",
    "ext4-core/crates/part",
    # macOS (FSKit)
    "ext4mac/crates/ext4-ffi",
    # Android
    "ext4android/crates/ext4-jni",
    "ext4android/crates/usb-msc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["xVanTuring"]

[workspace.lints.clippy]
# `x % n == 0` reads naturally next to the on-disk format arithmetic
manual_is_multiple_of = "allow"
too_many_arguments = "allow"
inconsistent_digit_grouping = "allow"
unusual_byte_groupings = "allow"
identity_op = "allow"

[workspace.dependencies]
ext4-core = { path = "ext4-core/crates/ext4-core" }
part = { path = "ext4-core/crates/part" }
usb-msc = { path = "ext4android/crates/usb-msc" }
jni = "0.22.4"
libc = "0.2.189"
log = "0.4.34"
thiserror = "2.0.21"

[profile.release]
debug = 1
lto = "thin"
# unwind (not abort): the FFI and JNI layers turn panics into errors
# instead of killing the file system extension or the app
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
