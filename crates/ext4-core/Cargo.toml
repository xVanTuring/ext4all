[package]
name = "ext4-core"
description = "Pure Rust ext4 file system implementation (read/write, jbd2 journal)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
crc32c = "0.6.8"
hkdf = "0.12"
hmac = "0.12"
log = "0.4.34"
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
rand = "0.10.3"
tempfile = "3.27.0"
