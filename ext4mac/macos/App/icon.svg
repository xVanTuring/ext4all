<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a8c"/>
      <stop offset="1" stop-color="#0b3c5d"/>
    </linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#c9d3dc"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3440"/>
      <stop offset="1" stop-color="#1a2029"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021a2b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 body centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- external drive -->
  <g filter="url(#shadow)">
    <rect x="232" y="330" width="560" height="380" rx="56" fill="url(#drive)"/>
    <rect x="272" y="370" width="480" height="220" rx="28" fill="url(#face)"/>
    <circle cx="700" cy="650" r="16" fill="#2ecc71"/>
    <rect x="292" y="638" width="220" height="24" rx="12" fill="#9aa8b5"/>
  </g>
  <!-- ext4 mark drawn as strokes (no font dependency) -->
  <g transform="translate(-24 0)" fill="none" stroke="#7fe3d0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- e -->
    <path d="M352 482 h70 a36 36 0 1 0 -12 28"/>
    <!-- x -->
    <path d="M462 446 l56 72 M518 446 l-56 72"/>
    <!-- t -->
    <path d="M572 416 v84 a18 18 0 0 0 34 8 M552 448 h52"/>
    <!-- 4 -->
    <path d="M700 518 v-102 l-62 76 h86"/>
  </g>
</svg>
