name: Ext4Kit
options:
  bundleIdPrefix: tech.xvanturing
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, zh-Hans]

settings:
  base:
    DEVELOPMENT_TEAM: T8F5T6HKG8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

# Settings shared by every target that links the Rust engine
settingGroups:
  engine:
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include
    HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/lib
    OTHER_LDFLAGS: -lext4_ffi

targets:
  Ext4Kit:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: Ext4Kit
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.ext4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ext4Kit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 xVanTuring. GPL-3.0-or-later."
        CODE_SIGN_ENTITLEMENTS: App/Ext4Kit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Ext4FS
        embed: true
        codeSign: true

  Ext4FS:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Ext4FS
      - path: Shared
    settings:
      groups: [engine]
      base:
        PRODUCT_NAME: Ext4FS
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.ext4.fs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Ext4FS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Ext4Kit ext4
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 xVanTuring. GPL-3.0-or-later."
        CODE_SIGN_ENTITLEMENTS: Ext4FS/Ext4FS.entitlements
        SKIP_INSTALL: YES
    preBuildScripts:
      - name: Build Rust engine
        script: |
          "$SRCROOT/../scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Vendor/lib/libext4_ffi.a
          - $(SRCROOT)/Vendor/include/ext4_ffi.h
    dependencies:
      - sdk: FSKit.framework

  Ext4KitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
      - path: Ext4FS
        excludes:
          - Ext4FSExtension.swift
          - Info.plist
          - "*.entitlements"
    settings:
      groups: [engine]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.ext4.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    preBuildScripts:
      - name: Build Rust engine
        script: |
          "$SRCROOT/../scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Vendor/lib/libext4_ffi.a
    dependencies:
      - sdk: FSKit.framework

schemes:
  Ext4Kit:
    build:
      targets:
        Ext4Kit: all
        Ext4KitTests: [test]
    test:
      targets:
        - Ext4KitTests
      gatherCoverageData: false
  Ext4KitTests:
    build:
      targets:
        Ext4KitTests: all
    test:
      targets:
        - Ext4KitTests
