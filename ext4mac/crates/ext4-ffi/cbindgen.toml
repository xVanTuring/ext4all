language = "C"
include_guard = "EXT4_FFI_H"
autogen_warning = "/* Generated by cbindgen from crates/ext4-ffi. Do not edit. */"
include_version = false
sys_includes = ["stdbool.h", "stdint.h", "stddef.h"]
no_includes = true
documentation = true
documentation_style = "doxy"
style = "both"
cpp_compat = true
# Swift imports size_t as Int (uintptr_t would be UInt)
usize_is_size_t = true

[export]
include = ["Ext4Attr", "Ext4SetAttr", "Ext4StatFs", "Ext4ProbeInfo", "Ext4MountOptions", "Ext4DeviceOps", "Ext4Time"]

[export.rename]

[enum]
prefix_with_name = true

[parse]
parse_deps = false
